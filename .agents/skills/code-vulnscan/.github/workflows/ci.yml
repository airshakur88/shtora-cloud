name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Enforce benchmark quality baseline
        run: python tests/benchmark/run_benchmark.py --check-baseline --results-dir /tmp/code-vulnscan-benchmark

  package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build runtime skill package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_ROOT="package/code-vulnscan"
          DIST_DIR="dist"
          mkdir -p "${PACKAGE_ROOT}" "${PACKAGE_ROOT}/workspace" "${DIST_DIR}"

          cp SKILL.md "${PACKAGE_ROOT}/"
          cp -R scripts sub-skills resources "${PACKAGE_ROOT}/"
          cp install.sh install.sh.sha256 install.ps1 install.ps1.sha256 "${PACKAGE_ROOT}/"

          # Strip build artifacts and dev-only paths
          find "${PACKAGE_ROOT}" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "${PACKAGE_ROOT}" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          touch "${PACKAGE_ROOT}/workspace/.gitkeep"

          tar -czf "${DIST_DIR}/code-vulnscan-skill-${TAG_NAME}.tar.gz" \
            -C package code-vulnscan

          (
            cd package
            zip -qr "../${DIST_DIR}/code-vulnscan-skill-${TAG_NAME}.zip" code-vulnscan
          )

          (
            cd "${DIST_DIR}"
            sha256sum "code-vulnscan-skill-${TAG_NAME}.tar.gz" \
              > "code-vulnscan-skill-${TAG_NAME}.tar.gz.sha256"
            sha256sum "code-vulnscan-skill-${TAG_NAME}.zip" \
              > "code-vulnscan-skill-${TAG_NAME}.zip.sha256"
          )

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-vulnscan-skill-${{ github.ref_name }}
          path: |
            dist/*
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
